<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>LaundryPay — Aplikasi Pembayaran Laundry</title>
  <meta name="theme-color" content="#0284c7" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="apple-touch-icon" href="/icon-192.png" />
  <link rel="icon" href="/icon-192.png" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    :root { --sky:#0284c7; --sky2:#06b6d4; --slate:#334155; --muted:#64748b; --line:#e2e8f0; --bg:#f1f5f9; }
    body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--slate); padding-bottom: env(safe-area-inset-bottom); }
    header { background: linear-gradient(90deg, var(--sky), var(--sky2)); color: #fff; padding: 14px 16px; padding-top: calc(14px + env(safe-area-inset-top)); display: flex; align-items: center; gap: 12px; position: sticky; top: 0; z-index: 20; }
    header .logo { background: rgba(255,255,255,.2); width: 42px; height: 42px; border-radius: 12px; display: grid; place-items: center; font-size: 22px; flex: none; }
    header h1 { font-size: 18px; line-height: 1.1; }
    header p { font-size: 11px; color: #e0f2fe; }
    .userbox { margin-left: auto; display: flex; align-items: center; gap: 10px; }
    .userbox .who { text-align: right; font-size: 12px; line-height: 1.2; }
    .userbox .who b { font-size: 13px; }
    .rolechip { font-size: 10px; padding: 1px 7px; border-radius: 999px; background: rgba(255,255,255,.25); text-transform: uppercase; letter-spacing: .5px; }
    .logout { background: rgba(255,255,255,.18); border: none; color: #fff; padding: 7px 10px; border-radius: 9px; font-size: 12px; cursor: pointer; font-weight: 600; }
    .logout:active { background: rgba(255,255,255,.3); }
    .wrap { max-width: 720px; margin: 0 auto; padding: 16px; }
    .tabs { display: flex; gap: 8px; max-width: 720px; margin: 12px auto 0; padding: 0 16px; overflow-x: auto; }
    .tab { flex: none; display: flex; align-items: center; gap: 6px; padding: 9px 16px; border-radius: 10px; font-size: 14px; font-weight: 600; border: none; background: #fff; color: var(--muted); cursor: pointer; white-space: nowrap; }
    .tab.active { background: var(--sky); color: #fff; box-shadow: 0 2px 6px rgba(2,132,199,.3); }
    .toolbar { display: flex; gap: 10px; margin-bottom: 14px; }
    .search { flex: 1; position: relative; }
    .search input { width: 100%; padding: 10px 12px 10px 34px; border: 1px solid var(--line); border-radius: 10px; font-size: 14px; }
    .search::before { content: "🔍"; position: absolute; left: 10px; top: 9px; font-size: 13px; opacity: .6; }
    .btn { border: none; border-radius: 10px; font-weight: 600; cursor: pointer; font-size: 14px; padding: 10px 16px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
    .btn-primary { background: var(--sky); color: #fff; }
    .btn-primary:active { background: #0369a1; }
    .btn-dark { background: #1e293b; color: #fff; width: 100%; }
    .card { background: #fff; border: 1px solid #f1f5f9; border-radius: 14px; padding: 14px; box-shadow: 0 1px 3px rgba(0,0,0,.04); margin-bottom: 12px; }
    .row-top { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
    .name { font-weight: 700; }
    .inv { font-size: 11px; color: #94a3b8; }
    .badge { font-size: 11px; padding: 2px 9px; border-radius: 999px; font-weight: 600; white-space: nowrap; }
    .b-proses { background:#fef3c7; color:#b45309; }
    .b-selesai { background:#dbeafe; color:#1d4ed8; }
    .b-diambil { background:#d1fae5; color:#047857; }
    .b-lunas { background:#d1fae5; color:#047857; }
    .b-belum { background:#ffe4e6; color:#be123c; }
    .sub { font-size: 13px; color: var(--muted); margin-top: 4px; }
    .hp { font-size: 11px; color: #94a3b8; }
    .price { font-weight: 700; color: var(--sky); white-space: nowrap; }
    .actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 12px; padding-top: 12px; border-top: 1px solid #f1f5f9; }
    .actions select { font-size: 12px; border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; background: #fff; }
    .chip { font-size: 12px; padding: 7px 12px; border-radius: 8px; border: none; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; font-weight: 600; }
    .chip-green { background:#059669; color:#fff; }
    .chip-gray { background:#f1f5f9; color:var(--muted); }
    .chip-red { background:transparent; color:#e11d48; margin-left: auto; }
    .empty { text-align:center; color:#94a3b8; padding: 40px 0; }
    /* laporan */
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
    .stat { border-radius: 14px; padding: 14px; color: #fff; }
    .stat .lbl { font-size: 11px; opacity: .9; margin-top: 6px; }
    .stat .val { font-size: 17px; font-weight: 700; margin-top: 2px; }
    .s1 { background: linear-gradient(135deg,#0ea5e9,#06b6d4); }
    .s2 { background: linear-gradient(135deg,#10b981,#14b8a6); }
    .s3 { background: linear-gradient(135deg,#8b5cf6,#a855f7); }
    .s4 { background: linear-gradient(135deg,#f43f5e,#f97316); }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    thead { background: #f8fafc; color: var(--muted); font-size: 11px; }
    th, td { padding: 9px 12px; text-align: left; }
    th.r, td.r { text-align: right; }
    tbody tr { border-top: 1px solid #f8fafc; }
    .tbl-wrap { background:#fff; border:1px solid #f1f5f9; border-radius:14px; overflow:hidden; }
    .tbl-title { padding: 12px 14px; font-weight: 700; font-size: 14px; border-bottom: 1px solid #f1f5f9; display:flex; justify-content:space-between; align-items:center; }
    .tbl-scroll { overflow-x:auto; }
    /* manajemen list */
    .mrow { background:#fff; border:1px solid #f1f5f9; border-radius:12px; padding:12px 14px; margin-bottom:10px; display:flex; align-items:center; gap:12px; }
    .mrow .info { flex:1; min-width:0; }
    .mrow .info b { font-size:14px; }
    .mrow .meta { font-size:12px; color:var(--muted); margin-top:2px; }
    .iconbtn { background:#f1f5f9; border:none; border-radius:8px; padding:7px 10px; cursor:pointer; font-size:13px; color:var(--slate); }
    .iconbtn.red { color:#e11d48; }
    /* modal */
    .overlay { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: flex; align-items: flex-end; justify-content: center; z-index: 50; }
    @media(min-width:600px){ .overlay{ align-items:center; padding:16px; } }
    .modal { background: #fff; width: 100%; max-width: 440px; border-radius: 20px 20px 0 0; max-height: 92vh; overflow-y: auto; }
    @media(min-width:600px){ .modal{ border-radius: 18px; } }
    .modal-head { display: flex; justify-content: space-between; align-items: center; padding: 16px 18px; border-bottom: 1px solid #f1f5f9; position: sticky; top: 0; background: #fff; }
    .modal-head h3 { font-size: 16px; }
    .x { background: none; border: none; font-size: 22px; color: #94a3b8; cursor: pointer; line-height: 1; }
    .modal-body { padding: 18px; }
    label.f { display:block; font-size: 12px; font-weight: 600; color: var(--muted); margin: 12px 0 5px; }
    label.f:first-child { margin-top: 0; }
    .inp { width: 100%; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; font-size: 14px; font-family: inherit; }
    .inp:focus { outline: none; border-color: var(--sky); box-shadow: 0 0 0 3px #bae6fd; }
    .two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .estimate { background:#e0f2fe; border-radius:10px; padding:12px 14px; display:flex; justify-content:space-between; align-items:center; margin-top:16px; font-size:14px; }
    .estimate b { color: var(--sky); font-size:16px; }
    .pay-total { text-align:center; margin:6px 0 16px; }
    .pay-total .amt { font-size: 30px; font-weight: 800; color: var(--sky); }
    .pay-methods { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
    .method { border:2px solid var(--line); border-radius:14px; padding:18px; text-align:center; font-weight:600; cursor:pointer; background:#fff; font-size:15px; }
    .method:active { border-color: var(--sky); background:#f0f9ff; }
    .method .ic { font-size:24px; display:block; margin-bottom:6px; }
    .receipt { border: 1px dashed #cbd5e1; border-radius: 12px; padding: 18px; font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 13px; }
    .receipt .center { text-align: center; }
    .receipt .store { font-weight: 800; font-size: 16px; letter-spacing: 1px; }
    .receipt .small { font-size: 11px; color: var(--muted); }
    .receipt hr { border: none; border-top: 1px dashed #cbd5e1; margin: 8px 0; }
    .rrow { display: flex; justify-content: space-between; padding: 2px 0; }
    .rrow .k { color: var(--muted); }
    .rtotal { display:flex; justify-content:space-between; font-weight:800; font-size:15px; }
    .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #1e293b; color: #fff; padding: 10px 18px; border-radius: 999px; font-size: 13px; z-index: 100; opacity: 0; transition: opacity .2s; pointer-events: none; }
    .toast.show { opacity: 1; }
    /* login */
    #loginView { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; background: linear-gradient(135deg,#0284c7,#06b6d4); }
    .login-card { background:#fff; border-radius:20px; padding:28px 24px; width:100%; max-width:360px; box-shadow:0 10px 40px rgba(0,0,0,.2); }
    .login-card .logo { width:56px; height:56px; border-radius:16px; background:linear-gradient(135deg,#0284c7,#06b6d4); display:grid; place-items:center; font-size:28px; margin:0 auto 12px; }
    .login-card h2 { text-align:center; font-size:20px; }
    .login-card p.tag { text-align:center; color:var(--muted); font-size:12px; margin-bottom:18px; }
    .login-err { background:#ffe4e6; color:#be123c; font-size:13px; padding:8px 12px; border-radius:8px; margin-bottom:12px; display:none; }
    .hint { text-align:center; font-size:11px; color:#94a3b8; margin-top:14px; }
    @media print {
      body * { visibility: hidden; }
      #receiptPrintable, #receiptPrintable * { visibility: visible; }
      #receiptPrintable { position: absolute; left: 0; top: 0; width: 100%; border: none; }
      .no-print { display: none !important; }
    }
  </style>
</head>
<body>
  <!-- ================= LOGIN ================= -->
  <div id="loginView" style="display:none">
    <form class="login-card" id="loginForm">
      <div class="logo">👕</div>
      <h2>LaundryPay</h2>
      <p class="tag">Masuk untuk melanjutkan</p>
      <div class="login-err" id="loginErr"></div>
      <label class="f">Username</label>
      <input class="inp" id="loginUser" autocomplete="username" placeholder="username" />
      <label class="f">Password</label>
      <input class="inp" id="loginPass" type="password" autocomplete="current-password" placeholder="password" />
      <button class="btn btn-primary" style="width:100%;margin-top:18px" type="submit">Masuk</button>
      <p class="hint">Akun owner awal — username: <b>owner</b>, password: <b>owner123</b><br>(ganti password setelah masuk)</p>
    </form>
  </div>

  <!-- ================= APP ================= -->
  <div id="appView" style="display:none">
    <header>
      <div class="logo">👕</div>
      <div>
        <h1>LaundryPay</h1>
        <p>Aplikasi Pembayaran Laundry</p>
      </div>
      <div class="userbox">
        <div class="who">
          <b id="uName">-</b><br><span class="rolechip" id="uRole">-</span>
        </div>
        <button class="logout" id="btnLogout">Keluar</button>
      </div>
    </header>

    <div class="tabs" id="tabs"></div>

    <div class="wrap">
      <div id="view-pesanan">
        <div class="toolbar">
          <div class="search"><input id="cari" placeholder="Cari nama / no. nota..." /></div>
          <button class="btn btn-primary" id="btnBaru">+ Baru</button>
        </div>
        <div id="daftar"></div>
      </div>

      <div id="view-laporan" style="display:none">
        <div class="grid" id="stats"></div>
        <div class="tbl-wrap">
          <div class="tbl-title" id="tblTitle">Riwayat Transaksi Lunas</div>
          <div class="tbl-scroll">
            <table>
              <thead><tr><th>No. Nota</th><th>Pelanggan</th><th>Tanggal</th><th>Metode</th><th class="r">Total</th></tr></thead>
              <tbody id="tblBody"></tbody>
            </table>
          </div>
        </div>
      </div>

      <div id="view-layanan" style="display:none">
        <button class="btn btn-primary" id="btnLayananBaru" style="margin-bottom:14px">+ Layanan Baru</button>
        <div id="daftarLayanan"></div>
      </div>

      <div id="view-akun" style="display:none">
        <button class="btn btn-primary" id="btnAkunBaru" style="margin-bottom:14px">+ Akun Baru</button>
        <div id="daftarAkun"></div>
      </div>
    </div>
  </div>

  <div id="modalRoot"></div>
  <div class="toast" id="toast"></div>

  <script src="/app.js"></script>
</body>
</html>
